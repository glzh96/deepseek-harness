\f0\fs24 \cf0 name: Build macOS Intel DMG\
\
on:\
  workflow_dispatch:\
\
permissions:\
  contents: read\
\
jobs:\
  build:\
    runs-on: macos-15-intel\
    timeout-minutes: 180\
    env:\
      DSH_DESKTOP_TARGET_PLATFORM: darwin\
      DSH_DESKTOP_TARGET_ARCH: x64\
      DSH_TELEMETRY_DISABLED: "1"\
\
    steps:\
      - name: Checkout\
        uses: actions/checkout@v7.0.1\
        with:\
          persist-credentials: false\
\
      - name: Setup pnpm\
        uses: pnpm/action-setup@v5.0.0\
        with:\
          run_install: false\
\
      - name: Setup Node.js\
        uses: actions/setup-node@v7.0.0\
        with:\
          node-version: "^24.22.3"\
          cache: pnpm\
\
      - name: Install dependencies\
        run: pnpm install --frozen-lockfile\
\
      - name: Check packaging\
        run: pnpm run package:desktop:mac:x64:unsigned --check\
\
      - name: Build Intel DMG\
        run: pnpm run package:desktop:mac:x64:unsigned\
\
      - name: Upload DMG\
        uses: actions/upload-artifact@v7.0.1\
        with:\
          name: deepseek-harness-macos-intel\
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg\
          if-no-files-found: error\
          retention-days: 14}